plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bookezaiwriting'
version = '0.1.0'

android {
  namespace "expo.modules.bookezaiwriting"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.google.mlkit:genai-prompt:1.0.0-beta2")
}
