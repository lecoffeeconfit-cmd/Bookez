name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npm run test:security
      - run: npm run test:ai-writing
      - run: npx expo export --platform ios --output-dir /tmp/bookez-ios-export
